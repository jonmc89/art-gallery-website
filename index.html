<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <title>Frontend Mentor | Art gallery website</title>
  </head>
  <body>
    <main>
      <section class="main-content">
        <picture class="main-content-hero-image">
          <source
            media="(min-width: 90rem)"
            srcset="./assets/desktop/image-hero@2x.jpg"
          />
          <source
            media="(min-width: 51.25rem)"
            srcset="./assets/tablet/image-hero@2x.jpg"
          />
          <img src="./assets/mobile/image-hero@2x.jpg" alt="" />
        </picture>
        <div class="gallery-info-container">
          <h1>Modern Art Gallery</h1>
          <p>
            The arts in the collection of the Modern Art Gallery all started
            from a spark of inspiration. Will these pieces inspire you? Visit us
            and find out.
          </p>
          <a class="our-location-btn" href="#">
            <div class="our-location-button-wrapper">
              <p>OUR LOCATION</p>
              <span
                ><img
                  src="./assets/icon-arrow-right.svg"
                  alt="Arrow pointing to the right in a white line, indicating navigation to the location section, inside a small rounded icon with a dark background and minimal modern gallery styling."
              /></span>
            </div>
          </a>
        </div>
      </section>
      <section class="gallery">
        <div class="gallery-hero-image-container"></div>
      </section>
    </main>
  </body>
</html>
